name: Second Action - Multiple Job Parallel

on:
  workflow_dispatch:
    
# Si tú no defines nada, ambos jobs se ejecutan en paralo

jobs:
  hello-world:
    runs-on: ubuntu-latest
    steps:
    - name: Fist Step
      run: echo "Hello World"
  bye-world:
    runs-on: ubuntu-latest
    # needs: hello-world # Se utiliza para hacer que se ejecuten de forma secuencial
    steps:
    - name: Fist Step
      run: echo "Hello World"
    - name: Second Step
      run: echo "Bye World"           